version: "3"

tasks:
  default:
    desc: Run all formatting supported.
    ignore_error: true
    cmds:
      - task: md
      - task: yaml
      - task: json
      - task: old-nix
      - task: sh
      - task: eof
      - task: whitespace
      - task: crlf
  pre-commit:
    desc: Pre-commit function (Taskfile)
    cmds:
      - pre-commit run -c ./config/.pre-commit-config.yaml {{.PC_ID}} --all-files

  eof:
    desc: Fix end of file lines
    cmds:
      - task: pre-commit
        vars:
          PC_ID: end-of-file-fixer
  whitespace:
    desc: Fix trailing white spaces
    cmds:
      - task: pre-commit
        vars:
          PC_ID: trailing-whitespace
  crlf:
    desc: Fix trailing white spaces
    cmds:
      - task: pre-commit
        vars:
          PC_ID: mixed-line-ending
  sh:
    desc: Format Shell Scripts
    cmds:
      - task: pre-commit
        vars:
          PC_ID: shfmt
  json:
    desc: Format JSON
    cmds:
      - task: pre-commit
        vars:
          PC_ID: json-fmt
  md:
    desc: Formats Markdown
    cmds:
      - task: pre-commit
        vars:
          PC_ID: md-fmt

  yaml:
    desc: Formats YAML
    cmds:
      - task: pre-commit
        vars:
          PC_ID: yaml-fmt

  nix:
    desc: Formats Nix files
    cmds:
      - task: pre-commit
        vars:
          PC_ID: nixpkgs-fmt
